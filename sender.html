<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>QR Transfer 发送端</title>
    <script src="senderJs/pako.min.js"></script>
    <script src="senderJs/qrcode.min.js"></script>
    <style>
        :root { --bg-color: #121212; --panel-bg: #1a1a1a; --accent-color: #007AFF; --text-main: #ffffff; --border-color: #333; }
        body { font-family: system-ui, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .left-panel { width: 360px; background: var(--panel-bg); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .right-panel { flex: 1; background: #000; display: flex; justify-content: center; align-items: center; position: relative; }
        #qrcode-container { background: white; padding: 15px; border-radius: 8px; display: none; width: 600px; height: 600px; box-sizing: border-box; transition: transform 0.1s linear; }
        #qrcode { width: 100% !important; height: 100% !important; }
        .stat-card { background: #252525; border-radius: 12px; padding: 15px; border: 1px solid var(--border-color); }
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .val { color: #00d2ff; font-weight: bold; }
        .tabs { display: flex; gap: 5px; }
        .tab { flex: 1; padding: 15px 8px; background: #333; text-align: center; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        .tab.active { background: var(--accent-color); color: white; }
        #fileInput { width: 100%; height: 50px; background: #252525; color: #fff; border: 1px solid var(--border-color); border-radius: 12px; font-size: 14px; cursor: pointer; box-sizing: border-box; }
        #fileInput::-webkit-file-upload-button { height: 100%; background: #333; color: #fff; border: none; border-right: 1px solid var(--border-color); padding: 0 15px; margin-right: 10px; cursor: pointer; }
        textarea { width: 100%; height: 80px; background: #111; color: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; resize: none; font-size: 14px; }
        input[type="range"] { width: 100%; accent-color: var(--accent-color); cursor: pointer; }
        .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-start { background: var(--accent-color); color: white; }
        .btn-stop { background: #ff3b30; color: white; display: none; }
        .btn-reset { background: #444; color: #ccc; }
        .tag { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; color: #000; position: absolute; top: 20px; right: 20px; z-index: 10; }
    </style>
</head>
<body>
<div class="left-panel">
    <h3 style="margin:0 0 10px 0;">🚀 QR Transfer 发送端</h3>
    <div class="tabs">
        <div id="tab-file" class="tab active" onclick="switchMode('file')">文件模式</div>
        <div id="tab-text" class="tab" onclick="switchMode('text')">文字模式</div>
    </div>
    <div id="input-area">
        <input type="file" id="fileInput" onchange="handleDataPrepare()">
        <textarea id="textInput" placeholder="在此输入文字..." oninput="handleDataPrepare()" style="display:none; margin-top:10px;"></textarea>
    </div>
    <div id="panel" class="stat-card" style="display:none">
        <div class="stat-line"><span>压缩大小:</span> <span id="stat-comp" class="val">-</span></div>
        <div class="stat-line"><span>总分片数:</span> <span id="stat-k" class="val">-</span></div>
        <div class="stat-line"><span>理论带宽:</span> <span id="stat-bps" class="val">0 KB/s</span></div>
        <div style="margin-top: 10px; border-top: 1px solid #444; padding-top: 10px;">
            <div class="stat-line"><span>当前状态:</span> <span id="stat-phase" class="val" style="color:#ffc107">就绪</span></div>
            <div class="stat-line"><span>分片进度:</span> <span id="stat-progress" class="val">0 / 0</span></div>
            <div class="stat-line"><span>累计外发:</span> <span id="stat-total-sent" class="val">0 MB</span></div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-line"><span>分片大小:</span> <span id="chunk-val" class="val">900 Bytes</span></div>
        <input type="range" id="chunkRange" min="50" max="1000" value="900" oninput="updateChunkSize(this.value)">
    </div>
    <div class="stat-card">
        <div class="stat-line"><span>发送间隔:</span> <span id="speed-val" class="val">80ms</span></div>
        <input type="range" id="speedRange" min="20" max="500" value="80" oninput="updateSpeed(this.value)">
    </div>
    <div class="stat-card">
        <div class="stat-line"><span>二维码缩放:</span> <span id="zoom-val" class="val">85%</span></div>
        <input type="range" id="sizeRange" min="30" max="200" value="85" oninput="updateQRSize(this.value)">
    </div>
    <button id="startBtn" class="btn-main btn-start" onclick="handleStart()" style="display:none">开始发送</button>
    <button id="stopBtn" class="btn-main btn-stop" onclick="handleStop()">停止发送</button>
    <button class="btn-main btn-reset" onclick="resetAll()">清空并重置</button>
</div>
<div class="right-panel">
    <div id="mode-tag" class="tag" style="background:#ffc107; display:none;">READY</div>
    <div id="qrcode-container">
        <canvas id="qrcode"></canvas>
    </div>
</div>
<script>
    // 默认值优化为高密度模式
    const DEFAULT_CHUNK_SIZE = 900;
    const DEFAULT_SPEED = 80;
    const DEFAULT_ZOOM = 85;
    let state = { K: 0, chunks: [], meta: null, timer: null, step: 0, running: false, speed: DEFAULT_SPEED, chunkSize: DEFAULT_CHUNK_SIZE, totalBytesSent: 0 };
    let currentMode = 'file';

    function calculateBps() {
        const kbps = ((state.chunkSize / (state.speed / 1000)) / 1024).toFixed(2);
        document.getElementById('stat-bps').innerText = kbps + " KB/s";
    }
    function updateChunkSize(val) {
        state.chunkSize = parseInt(val);
        document.getElementById('chunk-val').innerText = val + " Bytes";
        calculateBps(); handleDataPrepare();
    }
    function updateSpeed(val) {
        state.speed = parseInt(val);
        document.getElementById('speed-val').innerText = val + "ms";
        document.getElementById('speedRange').value = val;
        calculateBps(); if (state.running) { handleStop(); handleStart(); }
    }
    function updateQRSize(val) {
        document.getElementById('zoom-val').innerText = val + "%";
        document.getElementById('sizeRange').value = val;
        document.getElementById('qrcode-container').style.transform = `scale(${val / 100})`;
    }
    function switchMode(m) {
        currentMode = m;
        document.getElementById('tab-file').className = (m === 'file' ? 'tab active' : 'tab');
        document.getElementById('tab-text').className = (m === 'text' ? 'tab active' : 'tab');
        document.getElementById('fileInput').style.display = (m === 'file' ? 'block' : 'none');
        document.getElementById('textInput').style.display = (m === 'text' ? 'block' : 'none');
        resetAll();
    }
    async function handleDataPrepare() {
        const wasRunning = state.running; if (wasRunning) handleStop();
        let buf, name, type;
        if (currentMode === 'file') {
            const file = document.getElementById('fileInput').files[0]; if (!file) return;
            buf = new Uint8Array(await file.arrayBuffer()); name = file.name; type = file.type || 'bin';
        } else {
            const text = document.getElementById('textInput').value; if (!text) return;
            buf = new TextEncoder().encode(text); name = "TEXT"; type = "txt";
        }
        const compressed = pako.deflate(buf, { level: 9 });
        state.meta = { name, type, size: buf.length, cSize: compressed.length };
        state.K = Math.ceil(compressed.length / state.chunkSize);
        state.chunks = [];
        for (let i = 0; i < state.K; i++) state.chunks.push(compressed.slice(i * state.chunkSize, (i + 1) * state.chunkSize));
        document.getElementById('stat-comp').innerText = (compressed.length / 1024).toFixed(2) + " KB";
        document.getElementById('stat-k').innerText = state.K;
        document.getElementById('panel').style.display = 'block';
        document.getElementById('qrcode-container').style.display = 'block';
        document.getElementById('startBtn').style.display = 'block';
        calculateBps(); if (wasRunning) handleStart();
    }
    function getIndices(seed, K) {
        let m = 0x80000000, a = 1103515245, c = 12345, s = seed;
        const n = () => { s = (a * s + c) % m; return s; };
        let r = n() / m, d = (r < 1/K) ? 1 : Math.max(1, Math.floor(1/r)); if (d > K) d = K;
        let ids = Array.from({length: K}, (_, i) => i);
        for (let i = K - 1; i > 0; i--) { let j = Math.floor((n() / m) * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
        return ids.slice(0, d);
    }
    function handleStart() {
        if (state.chunks.length === 0) return;
        state.running = true;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        document.getElementById('mode-tag').style.display = 'block';
        const canvas = document.getElementById('qrcode');
        const phaseEl = document.getElementById('stat-phase');
        const progressEl = document.getElementById('stat-progress');
        const totalSentEl = document.getElementById('stat-total-sent');
        const miniMeta = `${state.meta.name}*${state.meta.cSize}*${state.K}`;

        state.timer = setInterval(() => {
            let id, data, tagTxt, tagBg;
            const rand = Math.random();
            // 元数据广播频率略微下调以提升数据带宽
            if (state.step % 50 === 0) {
                id = -1; data = new TextEncoder().encode(JSON.stringify(state.meta));
                tagTxt = "META"; tagBg = "#ffc107";
                phaseEl.innerText = "广播全局元数据";
            } else if (rand < 0.40) {
                let seqId = (state.step % state.K);
                id = seqId; data = state.chunks[id];
                tagTxt = `SEQ ${id+1}/${state.K}`; tagBg = "#28a745";
                phaseEl.innerText = "顺序分片传输";
                progressEl.innerText = `${id + 1} / ${state.K}`;
            } else {
                id = Math.floor(Math.random() * 1000000) + 1000000;
                const idxs = getIndices(id, state.K);
                data = new Uint8Array(state.chunkSize);
                idxs.forEach(idx => { const src = state.chunks[idx]; for(let j=0; j<src.length; j++) data[j] ^= src[j]; });
                tagTxt = "FTN"; tagBg = "#af52de";
                phaseEl.innerText = "全随机喷泉广播";
            }
            state.totalBytesSent += data.length;
            totalSentEl.innerText = (state.totalBytesSent / (1024 * 1024)).toFixed(2) + " MB";
            const payload = `${id}|${miniMeta}|${btoa(String.fromCharCode(...data))}`;
            // 核心：强制使用 ErrorCorrectionLevel.L 提升密度
            QRCode.toCanvas(canvas, payload, { margin: 1, width: 600, errorCorrectionLevel: 'L' });
            document.getElementById('mode-tag').innerText = tagTxt;
            document.getElementById('mode-tag').style.background = tagBg;
            state.step++;
        }, state.speed);
    }
    function handleStop() {
        if (state.timer) clearInterval(state.timer);
        state.running = false;
        document.getElementById('startBtn').style.display = state.chunks.length ? 'block' : 'none';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('stat-phase').innerText = "已停止";
        const canvas = document.getElementById('qrcode');
        if(canvas.getContext) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }
    function resetAll() {
        handleStop();
        state = { K: 0, chunks: [], meta: null, timer: null, step: 0, running: false, speed: DEFAULT_SPEED, chunkSize: DEFAULT_CHUNK_SIZE, totalBytesSent: 0 };
        document.getElementById('fileInput').value = ""; document.getElementById('textInput').value = "";
        document.getElementById('panel').style.display = 'none'; document.getElementById('qrcode-container').style.display = 'none';
        document.getElementById('mode-tag').style.display = 'none';
        document.getElementById('chunkRange').value = DEFAULT_CHUNK_SIZE;
        document.getElementById('chunk-val').innerText = DEFAULT_CHUNK_SIZE + " Bytes";
        document.getElementById('stat-total-sent').innerText = "0 MB";
        updateSpeed(DEFAULT_SPEED); updateQRSize(DEFAULT_ZOOM);
    }
    updateQRSize(DEFAULT_ZOOM);
</script>
</body>
</html>
