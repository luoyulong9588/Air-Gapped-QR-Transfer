<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QR Transfer 接收端</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/8899/8899671.png">
    <script src="receiverJs/pako.min.js"></script>
    <script src="receiverJs/html5-qrcode.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA 注册成功'))
                    .catch(err => console.log('PWA 注册失败', err));
            });
        }
    </script>

    <style>
        :root { --panel-bg: rgba(25, 25, 25, 0.95); --accent-color: #007bff; }

        /* 防止整体页面滚动，锁定在 100dvh */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            overflow: hidden; background: #000; color: white;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* 预览区域：全屏背景 */
        #reader { position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 1; background: #000; }
        #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }

        /* 隐藏库自带 UI */
        #reader__dashboard_section_csr, #reader__dashboard_section_swaplink, #reader__status_span, #reader__header_message { display: none !important; }

        /* 主面板：使用 flex 布局锁定位置 */
        .ui-panel {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: var(--panel-bg);
            z-index: 100; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid #333; border-radius: 24px 24px 0 0;
            box-sizing: border-box;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.8);

            /* 关键点：限制最大高度，并使用 flex 布局 */
            display: flex; flex-direction: column;
            max-height: 80dvh;
            /* 适配底部安全区 */
            padding: 20px 20px calc(15px + env(safe-area-inset-bottom)) 20px;
        }

        /* 可滚动区域：文件名和文本预览在此处滚动 */
        .scroll-content {
            overflow-y: auto;
            flex: 1; /* 自动撑开/收缩 */
            margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .progress-container { width: 100%; height: 6px; background: #333; border-radius: 3px; margin: 12px 0; overflow: hidden; flex-shrink: 0; }
        #progress-fill { height: 100%; width: 0%; background: var(--accent-color); transition: width 0.1s linear; opacity: 0; }

        .stats { display: flex; justify-content: space-between; width: 100%; margin-bottom: 15px; flex-shrink: 0; }
        .stat-item { text-align: center; flex: 1; }
        .stat-v { font-size: 14px; font-weight: bold; color: #00d2ff; display: block; font-family: monospace; }
        .stat-l { font-size: 10px; color: #888; margin-top: 4px; text-transform: uppercase; }

        #text-display {
            display: none; width: 100%; background: rgba(0,0,0,0.3);
            border-radius: 12px; padding: 12px; font-size: 14px; margin-top: 10px;
            color: #eee; word-break: break-all; box-sizing: border-box; border: 1px solid #444;
        }

        /* 按钮组：锁定在最下方，不参与滚动 */
        .btn-group { width: 100%; display: flex; flex-direction: column; gap: 8px; align-items: center; flex-shrink: 0; }
        .action-btn { display: none; width: 100%; max-width: 320px; padding: 14px; border-radius: 14px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; text-decoration: none; }
        #download-btn { background: #28a745; color: white; }
        #copy-btn { background: var(--accent-color); color: white; }
        #reset-btn { background: rgba(255,255,255,0.1); color: #ccc; border: none; padding: 10px 20px; border-radius: 20px; font-size: 13px; margin-top: 5px; cursor: pointer; }

        #ios-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>
    <div id="reader"></div>

    <div id="ios-overlay" onclick="startScanner()">
        <div style="font-size: 50px; margin-bottom: 20px;">📷</div>
        <div style="font-weight: bold; font-size: 18px;">点按屏幕开启摄像头</div>
    </div>

    <div class="ui-panel">
        <div class="scroll-content">
            <div id="file-info" style="text-align:center; font-size:16px; color:#fff; font-weight: bold; margin-bottom:5px;">等待扫描...</div>
            <div class="progress-container">
                <div id="progress-fill"></div>
            </div>
            <div id="text-display"></div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span id="count-display" class="stat-v">0 / -</span>
                <span class="stat-l">Chunks</span>
            </div>
            <div class="stat-item">
                <span id="speed-display" class="stat-v">0 KB/s</span>
                <span class="stat-l">Speed</span>
            </div>
            <div class="stat-item">
                <span id="eta-display" class="stat-v">0s / 0s</span>
                <span class="stat-l">Time / ETA</span>
            </div>
        </div>

        <div class="btn-group">
            <a id="download-btn" class="action-btn">保存文件到本地</a>
            <button id="copy-btn" class="action-btn" onclick="copyText()">复制文字内容</button>
            <button id="reset-btn" onclick="location.reload()">重新接收</button>
        </div>
    </div>

    <script>
        let startTime = null, speedUpdateTimer = null, finished = false, decoder = null, html5QrCode = null;
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        window.onload = () => { if (isIOS) document.getElementById('ios-overlay').style.display = 'flex'; else startScanner(); };

        async function startScanner() {
            if (isIOS) document.getElementById('ios-overlay').style.display = 'none';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 30, formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] },
                    onScanSuccess
                );
            } catch (err) { alert("摄像头启动失败。"); }
        }

        // 32位异或加速
        function fastXOR(target, source) {
            const len = target.length;
            const words = Math.floor(len / 4);
            const t32 = new Uint32Array(target.buffer, target.byteOffset, words);
            const s32 = new Uint32Array(source.buffer, source.byteOffset, words);
            for (let i = 0; i < words; i++) t32[i] ^= s32[i];
            for (let i = words * 4; i < len; i++) target[i] ^= source[i];
        }

        function HybridDecoder(K) {
            this.K = K; this.solvedSymbols = new Array(K).fill(null); this.solvedCount = 0; this.fileMeta = null; this.waitingFor = new Map();
            this.getIndices = (seed) => {
                let m = 0x80000000, a = 1103515245, c = 12345, s = seed;
                const n = () => { s = (a * s + c) % m; return s; };
                let r = n() / m, d = (r < 1/K) ? 1 : Math.max(1, Math.floor(1/r)); if (d > K) d = K;
                let ids = Array.from({length: K}, (_, i) => i);
                for (let i = K - 1; i > 0; i--) { let j = Math.floor((n() / m) * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
                return ids.slice(0, d);
            };
            this.process = (id, rawData) => {
                const data = new Uint8Array(rawData);
                if (id < 1000000) this.store(id, data);
                else this.reduce({ indices: this.getIndices(id), data: data, solved: false });
                return this.solvedCount >= this.K;
            };
            this.reduce = (block) => {
                let remaining = [];
                for (let i = 0; i < block.indices.length; i++) {
                    let idx = block.indices[i];
                    if (this.solvedSymbols[idx]) fastXOR(block.data, this.solvedSymbols[idx]);
                    else remaining.push(idx);
                }
                block.indices = remaining;
                if (block.indices.length === 1) {
                    block.solved = true; this.store(block.indices[0], new Uint8Array(block.data));
                } else if (block.indices.length > 1) {
                    for (let idx of block.indices) {
                        let list = this.waitingFor.get(idx);
                        if (!list) { list = []; this.waitingFor.set(idx, list); }
                        list.push(block);
                    }
                }
            };
            this.store = (idx, data) => {
                if (idx >= this.K || this.solvedSymbols[idx]) return;
                this.solvedSymbols[idx] = data; this.solvedCount++;
                let dependentBlocks = this.waitingFor.get(idx);
                if (dependentBlocks) {
                    this.waitingFor.delete(idx);
                    for (let block of dependentBlocks) {
                        if (block.solved) continue;
                        let pos = block.indices.indexOf(idx);
                        if (pos !== -1) {
                            block.indices.splice(pos, 1);
                            fastXOR(block.data, data);
                            if (block.indices.length === 1) { block.solved = true; this.store(block.indices[0], new Uint8Array(block.data)); }
                        }
                    }
                }
            };
            this.assemble = () => {
                const cSize = this.fileMeta.cSize; const comp = new Uint8Array(cSize);
                const chunkLen = this.solvedSymbols.find(s => s !== null).length;
                for (let i = 0; i < this.K; i++) {
                    const writeLen = Math.min(chunkLen, cSize - i * chunkLen);
                    if (writeLen > 0) comp.set(this.solvedSymbols[i].slice(0, writeLen), i * chunkLen);
                }
                return pako.inflate(comp);
            };
        }

        function formatTime(s) {
            if (!isFinite(s) || s < 0) return "0s";
            if (s < 60) return Math.floor(s) + "s";
            return Math.floor(s/60) + "m" + Math.floor(s%60) + "s";
        }

        let lastDecodedText = "";
        function onScanSuccess(txt) {
            if (finished || txt === lastDecodedText) return;
            lastDecodedText = txt;
            const parts = txt.split('|'); if (parts.length < 3) return;
            const id = parseInt(parts[0]);
            const miniMetaStr = parts[1];
            const b64 = parts[2];

            if (!decoder) {
                const m = miniMetaStr.split('*');
                if (m.length < 3) return;
                const meta = { name: m[0], cSize: parseInt(m[1]), K: parseInt(m[2]) };
                decoder = new HybridDecoder(meta.K); decoder.fileMeta = meta;
                document.getElementById('file-info').innerText = (meta.name === "TEXT" ? "📝 文本接收中..." : "📦 " + meta.name);
                document.getElementById('progress-fill').style.opacity = "1";
                startTime = Date.now();
                speedUpdateTimer = setInterval(() => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    const cps = decoder.solvedCount / elapsed;
                    const eta = cps > 0 ? (decoder.K - decoder.solvedCount) / cps : 0;
                    const bps = (decoder.solvedCount * (decoder.fileMeta.cSize / decoder.K)) / elapsed;
                    document.getElementById('speed-display').innerText = bps < 1024 ? bps.toFixed(0) + " B/s" : (bps/1024).toFixed(1) + " KB/s";
                    document.getElementById('eta-display').innerText = formatTime(elapsed) + " / " + formatTime(eta);
                }, 1000);
            }

            if (id === -1) return;
            try {
                const bin = atob(b64); const data = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
                if (decoder.process(id, data)) {
                    finished = true; clearInterval(speedUpdateTimer);
                    if(html5QrCode) html5QrCode.stop().catch(console.error);
                    const final = decoder.assemble();
                    if (decoder.fileMeta.name === "TEXT") {
                        const decodedText = new TextDecoder().decode(final);
                        const displayEl = document.getElementById('text-display');
                        displayEl.innerText = decodedText; displayEl.style.display = "block";
                        document.getElementById('copy-btn').style.display = "block";
                    } else {
                        const blob = new Blob([final]);
                        const dlBtn = document.getElementById('download-btn');
                        dlBtn.href = URL.createObjectURL(blob); dlBtn.download = decoder.fileMeta.name;
                        dlBtn.style.display = "block";
                    }
                    document.getElementById('speed-display').innerText = "完成";
                    document.getElementById('file-info').innerText = "✅ 接收成功";
                }
                document.getElementById('count-display').innerText = `${decoder.solvedCount} / ${decoder.K}`;
                document.getElementById('progress-fill').style.width = (decoder.solvedCount / decoder.K * 100) + "%";
            } catch(e) { console.error("解码错误:", e); }
        }

        function copyText() {
            const text = document.getElementById('text-display').innerText;
            navigator.clipboard.writeText(text).then(() => alert("内容已复制到剪贴板"));
        }
    </script>
</body>
</html>
